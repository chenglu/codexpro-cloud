name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Upstream Core (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upstream smoke tests
        run: npm run smoke

      - name: Stress tests
        run: npm run stress

      - name: Check package contents
        run: npm pack --dry-run

      - name: Install packed package
        run: npm run package:smoke

      - name: Dependency audit
        run: npm audit --audit-level=high

  cloud:
    name: Cloud Security Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cloud smoke tests
        run: npm run cloud:smoke

      - name: Dependency audit
        run: npm audit --audit-level=high

  docker:
    name: Docker Build And First Run
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: codexpro-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify attachment imports across volumes
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e CODEXPRO_TEST_WORKSPACE_ROOT=/workspace \
            -e CODEXPRO_TEST_REQUIRE_SEPARATE_FILESYSTEMS=1 \
            -v "$PWD/scripts/cloud-import-smoke.mjs:/app/scripts/cloud-import-smoke.mjs:ro" \
            --entrypoint node codexpro-cloud:ci scripts/cloud-import-smoke.mjs

      - name: Verify unconfigured container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name codexpro-cloud-ci \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e CODEXPRO_CLOUD_DISABLE_QUICK_TUNNEL=1 \
            -p 127.0.0.1:18789:8789 \
            codexpro-cloud:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18789/setup >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs codexpro-cloud-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs codexpro-cloud-ci 2>&1 || true

      - name: Remove test container
        if: always()
        run: docker rm -f codexpro-cloud-ci >/dev/null 2>&1 || true
