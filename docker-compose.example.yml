services:
  codexpro-cloud:
    image: ghcr.io/chenglu/codexpro-cloud:latest
    container_name: codexpro-cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEXPRO_ADMIN_PORT:-8789}:8789"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - codexpro-data:/data
      - codexpro-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 20s

volumes:
  codexpro-data:
  codexpro-workspace:
